{% extends "base.html" %}
{% block title %}إنشاء حساب | ALHAM{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card animate-on-scroll fade-up">
    <div class="text-center mb-4">
      <div class="auth-icon-circle">
        <i class="ph-fill ph-user-plus"></i>
      </div>
      <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">انضم إلينا</h1>
      <p class="text-muted mb-0">أنشئ حسابك لبدء رحلة القراءة</p>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="name" class="form-label">
          <i class="ph ph-user"></i> الاسم الكامل
        </label>
        <input type="text" name="name" id="name" class="form-control" placeholder="الاسم" required>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">
          <i class="ph ph-envelope"></i> البريد الإلكتروني
        </label>
        <input type="email" name="email" id="email" class="form-control" placeholder="اسمك@example.com" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">
          <i class="ph ph-lock"></i> كلمة المرور
        </label>
        <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
        <small class="text-muted mt-1 d-block">6 أحرف على الأقل</small>
      </div>

      <div class="form-group">
        <label for="password_confirm" class="form-label">
          <i class="ph ph-lock-key"></i> تأكيد كلمة المرور
        </label>
        <input type="password" name="password_confirm" id="password_confirm" class="form-control" placeholder="••••••••"
          required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-3 mt-2">
        <i class="ph ph-user-plus"></i>
        إنشاء حساب
      </button>
    </form>

    <div class="divider">
      <span>أو</span>
    </div>

    <div class="text-center">
      <p class="text-muted mb-3">لديك حساب بالفعل؟</p>
      <a href="{{ url_for('auth.login') }}" class="btn btn-secondary w-100 justify-content-center">
        <i class="ph ph-sign-in"></i>
        تسجيل الدخول
      </a>
    </div>

    <div class="features-row">
      <div class="feature-item">
        <i class="ph-fill ph-brain"></i>
        توصيات AI
      </div>
      <div class="feature-item">
        <i class="ph-fill ph-books"></i>
        مكتبة شخصية
      </div>
      <div class="feature-item">
        <i class="ph-fill ph-chart-line-up"></i>
        أدوات قراءة
      </div>
    </div>
  </div>
</section>
{% endblock %}

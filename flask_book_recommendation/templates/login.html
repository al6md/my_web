{% extends "base.html" %}
{% block title %}تسجيل الدخول | ALHAM{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card animate-on-scroll fade-up">
    <div class="text-center mb-4">
      <div class="auth-icon-circle">
        <i class="ph-fill ph-sign-in"></i>
      </div>
      <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">مرحباً بعودتك</h1>
      <p class="text-muted mb-0">سجل دخولك للمتابعة</p>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="email" class="form-label">
          <i class="ph ph-envelope"></i> البريد الإلكتروني
        </label>
        <input type="email" name="email" id="email" class="form-control" placeholder="اسمك@example.com" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">
          <i class="ph ph-lock"></i> كلمة المرور
        </label>
        <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-3 mt-2">
        <i class="ph ph-sign-in"></i>
        تسجيل الدخول
      </button>
    </form>

    <div class="divider">
      <span>أو</span>
    </div>

    <div class="text-center">
      <p class="text-muted mb-3">ليس لديك حساب؟</p>
      <a href="{{ url_for('auth.register') }}" class="btn btn-secondary w-100 justify-content-center">
        <i class="ph ph-user-plus"></i>
        إنشاء حساب جديد
      </a>
    </div>
  </div>
</section>
{% endblock %}

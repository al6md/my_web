{% extends "base.html" %}
{% block title %}قراءة | {{ title }}{% endblock %}

{% block content %}
<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="m-0">{{ title }}</h5>
    <a class="btn btn-sm btn-outline-info"
       href="https://books.google.com/books?id={{ google_id }}" target="_blank" rel="noopener">افتح على Google</a>
  </div>
  <div class="ratio ratio-4x3 border rounded">
    <iframe
      src="https://books.google.com/books?id={{ google_id }}&printsec=frontcover&output=embed"
      title="{{ title }}" loading="lazy" style="border:0;"></iframe>
  </div>
</div>
{% endblock %}

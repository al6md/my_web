{% extends "base.html" %}
{% block title %}قارئ الكتاب{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">{{ title or "قارئ الكتاب" }}</h4>
    <a class="btn btn-sm btn-outline-light"
       href="{{ url_for('public.list_books') }}">
      الرجوع إلى الكتب العامة
    </a>
  </div>

  {% if src %}
    <div class="mb-2 small text-muted">
      لو لم يظهر الكتاب، جرّب فتحه من
      <a href="{{ src }}" target="_blank">هذا الرابط</a>.
    </div>

    <div class="border rounded overflow-hidden shadow-sm"
         style="width:100%; height:80vh; background:#000;">
      <iframe
        src="{{ src }}"
        style="border:0; width:100%; height:100%;"
        allowfullscreen
        loading="lazy">
      </iframe>
    </div>
  {% else %}
    <div class="alert alert-warning">
      لا يوجد رابط قراءة مضمَّن لهذا الكتاب.
    </div>
  {% endif %}
</div>
{% endblock %}

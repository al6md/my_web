{% extends "base.html" %}

{% block title %}حائط الإلهام | إلهام{% endblock %}

{% block content %}
<style>
    .wall-header {
        text-align: center;
        padding: 60px 20px;
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(168, 85, 247, 0.1));
        border-radius: 20px;
        margin-bottom: 40px;
    }

    /* Masonry Grid */
    .masonry-grid {
        column-count: 3;
        column-gap: 20px;
    }

    @media (max-width: 900px) {
        .masonry-grid {
            column-count: 2;
        }
    }

    @media (max-width: 600px) {
        .masonry-grid {
            column-count: 1;
        }
    }

    .quote-card {
        break-inside: avoid;
        margin-bottom: 20px;
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease;
    }

    .quote-card:hover {
        transform: translateY(-5px);
    }

    .quote-content {
        padding: 30px 25px;
        min-height: 250px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .quote-text {
        font-size: 1.4rem;
        font-weight: 700;
        line-height: 1.6;
        margin-bottom: 20px;
        font-family: 'Tajawal', sans-serif;
    }

    .quote-meta {
        font-size: 0.9rem;
        opacity: 0.8;
    }

    .user-badge {
        position: absolute;
        bottom: 15px;
        right: 15px;
        background: rgba(0, 0, 0, 0.3);
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
        display: flex;
        align-items: center;
        gap: 5px;
        color: white;
    }

    /* Themes */
    .theme-aurora {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
    }

    .theme-dark {
        background: #1a1a1a;
        color: #e5e5e5;
        border: 1px solid #333;
    }

    .theme-sunset {
        background: linear-gradient(45deg, #ff9a9e, #fad0c4);
        color: #4a1d1d;
    }

    .theme-paper {
        background: #fdfbf7;
        color: #2c3e50;
        border: 1px solid #e0e0e0;
    }
</style>

<div class="container mt-4">
    <div class="wall-header animate-on-scroll fade-up">
        <h1 style="font-size: 3rem; margin-bottom: 15px;">🧱 حائط الإلهام</h1>
        <p class="text-muted" style="font-size: 1.2rem;">اكتشف روائع ما قرأه الآخرون وشاركهم إلهامك</p>
    </div>

    <div id="loadingWall" style="text-align:center; padding:50px;">
        <i class="ph ph-spinner" style="font-size:40px; animation:spin 1s infinite; color:var(--text-color);"></i>
    </div>

    <div class="masonry-grid" id="wallGrid"></div>
</div>

<script>
    async function loadWall() {
        try {
            const res = await fetch('/public/api/wall/feed');
            const quotes = await res.json();

            document.getElementById('loadingWall').style.display = 'none';
            const grid = document.getElementById('wallGrid');

            if (quotes.length === 0) {
                grid.innerHTML = '<div style="text-align:center; width:100%; grid-column:span 3;"><h3>لا توجد اقتباسات بعد. كن أول من يشارك! 🚀</h3></div>';
                return;
            }

            quotes.forEach(q => {
                const card = document.createElement('div');
                card.className = `quote-card theme-${q.theme}`;
                card.innerHTML = `
        <div class="quote-content">
          <i class="ph-fill ph-quotes" style="font-size:30px; margin-bottom:15px; opacity:0.5;"></i>
          <div class="quote-text">"${q.quote}"</div>
          <div class="quote-meta">
            — ${q.author}<br>
            <small style="opacity:0.7">📖 ${q.book_title}</small>
          </div>
          <div class="user-badge">
            <i class="ph-fill ph-user"></i> ${q.user_name}
          </div>
        </div>
      `;
                grid.appendChild(card);
            });

        } catch (e) {
            console.error(e);
            document.getElementById('wallGrid').innerHTML = '<p class="text-center text-danger">فشل تحميل الحائط</p>';
        }
    }

    document.addEventListener('DOMContentLoaded', loadWall);
</script>
{% endblock %}
